name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Build fake-chroot-ng for arm64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make
          git clone --depth 1 https://github.com/sylirre/fake-chroot-ng.git /tmp/fake-chroot-ng
          make -C /tmp/fake-chroot-ng CROSS=aarch64-linux-gnu-
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0755 /tmp/fake-chroot-ng/build/chroot-ng app/src/main/jniLibs/arm64-v8a/libchroot_ng.so
      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-debug
          path: app/build/outputs/apk/debug/*.apk
